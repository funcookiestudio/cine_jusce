<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0f18">
<title>Cine Jusce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --velvet:#2a0f18; --wine:#4a1424; --wine-2:#5e1c31;
  --ticket:#f2e3c6; --ink:#2a0f18; --lamp:#e8a33d; --mint:#8fc4b0; --red:#c8434f;
  --muted:rgba(242,227,198,.6); --faint:rgba(242,227,198,.1);
  --line:rgba(242,227,198,.14);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--velvet);color:var(--ticket);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;
  background-image:radial-gradient(ellipse at 50% -10%,var(--wine-2),transparent 60%);
  -webkit-tap-highlight-color:transparent}
h1,h2{font-family:"Bricolage Grotesque",sans-serif;margin:0;line-height:1.05}
button{font:inherit;cursor:pointer;color:inherit}
input{font:inherit}
svg{display:block}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.hidden{display:none!important}

.btn{border:0;border-radius:10px;min-height:48px;padding:0 20px;font-weight:500;background:var(--ink);color:var(--ticket)}
.btn:hover{background:var(--wine-2)}
.btn.lamp{background:var(--lamp);color:var(--ink)}
.btn.lamp:hover{filter:brightness(1.08)}
.btn.quiet{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:40px}
.btn.quiet:hover{background:rgba(42,15,24,.06)}

/* ---------- Entrada ---------- */
#home{min-height:100%;display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
.home-card{width:min(420px,100%);display:grid;gap:28px}
.brand h1{font-size:clamp(40px,11vw,56px);font-weight:800}
.brand p{margin:10px 0 0;color:var(--muted)}
.ticket{background:var(--ticket);color:var(--ink);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:16px;
  -webkit-mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat}
.field{display:grid;gap:6px}
.field span{font-size:13px;font-weight:500;opacity:.7}
.ticket input{width:100%;min-width:0;min-height:48px;border:2px solid rgba(42,15,24,.25);border-radius:10px;background:#fff9ea;color:var(--ink);
  padding:0 14px;font-size:17px}
.ticket input:focus{border-color:var(--ink);outline:none}
.ticket input.code{font:500 18px "Bricolage Grotesque",sans-serif;letter-spacing:.16em;text-transform:uppercase}
.ticket .row{display:flex;gap:10px}
.divider{display:flex;align-items:center;gap:12px;font-size:13px;opacity:.6}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dashed rgba(42,15,24,.35)}
#createBlock .btn{width:100%}
.hint{margin:0;font-size:14px;color:var(--muted);text-align:center}
/* Quem chega por link vê “Entrar” primeiro */
.invited #joinBlock{order:1}
.invited .divider{order:2}
.invited #createBlock{order:3}
.invited #createBlock .btn{background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;min-height:40px}

/* ---------- Sala ---------- */
#room{height:100vh;height:100dvh;display:grid;
  grid-template-columns:1fr 340px;grid-template-rows:auto 1fr auto;
  grid-template-areas:"top top" "screen panel" "controls panel"}
.top{grid-area:top;display:flex;align-items:center;gap:12px;padding:10px 16px;
  padding-top:max(10px,env(safe-area-inset-top));border-bottom:1px solid var(--line)}
.chip{display:flex;align-items:center;gap:8px;min-height:40px;border:0;border-radius:999px;padding:0 14px 0 16px;background:var(--ticket);color:var(--ink)}
.chip small{font-size:12px;opacity:.65}
.chip b{font:800 18px "Bricolage Grotesque",sans-serif;letter-spacing:.16em}
.chip svg{width:18px;height:18px;opacity:.75}
.status{margin-left:auto;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--lamp)}
.dot.on{background:var(--mint)}

.screen{grid-area:screen;position:relative;display:grid;place-items:center;background:#000;min-height:0}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.empty{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;padding:20px}
.empty h2{font-size:clamp(20px,4vw,28px)}
.empty p{margin:0 auto;max-width:40ch;font-size:15px;color:var(--muted)}
.unmute{position:absolute;bottom:16px;left:50%;transform:translateX(-50%)}

/* Controles */
.controls{grid-area:controls;display:flex;justify-content:center;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;border:0;background:none;padding:2px 4px;font-size:12px;color:var(--muted)}
.ctl i{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;background:var(--faint);color:var(--ticket);transition:background .15s}
.ctl svg{width:22px;height:22px}
.ctl:hover i{background:rgba(242,227,198,.18)}
.ctl.primary i{background:var(--lamp);color:var(--ink)}
.ctl.danger i{background:var(--red)}
.ctl[aria-pressed=false] i{background:var(--red)}
.ctl:disabled{opacity:.45;cursor:default}
.slash{display:none}
[aria-pressed=false] .slash{display:inline}

/* Painel: abas Chat / Pessoas */
.panel{grid-area:panel;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:rgba(0,0,0,.16)}
.tabs{display:flex;padding:8px 8px 0;gap:4px;border-bottom:1px solid var(--line)}
.tab{flex:1;min-height:44px;border:0;background:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;
  display:flex;align-items:center;justify-content:center;gap:8px}
.tab[aria-selected=true]{color:var(--ticket);border-bottom-color:var(--lamp)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--lamp);color:var(--ink);font-size:12px;line-height:20px}
.count{font-size:13px;opacity:.7}
.pane{flex:1;min-height:0;display:flex;flex-direction:column}

#log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--faint);align-self:flex-start;overflow-wrap:anywhere}
.msg b{display:block;font-size:12px;font-weight:500;color:var(--lamp)}
.msg.me{align-self:flex-end;background:var(--lamp);color:var(--ink)}
.msg.sys{align-self:center;background:none;padding:2px 8px;font-size:13px;color:var(--muted);text-align:center}
.send{display:flex;gap:8px;padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.send input{flex:1;min-width:0;min-height:44px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.25);color:var(--ticket);padding:0 16px;font-size:16px}
.send input:focus{outline:none;border-color:var(--lamp)}
.icon-btn{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--lamp);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}

/* Pessoas e volumes */
.people{flex:1;overflow:auto;padding:6px 16px max(16px,env(safe-area-inset-bottom))}
.person{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.avatar{width:10px;height:10px;border-radius:50%;background:rgba(242,227,198,.25);flex:none;transition:box-shadow .12s,background .12s}
.person.talking .avatar{background:var(--mint);box-shadow:0 0 0 4px rgba(143,196,176,.3)}
.person.film .avatar{border-radius:2px;background:var(--lamp)}
.pct{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:4ch;text-align:right}
.mute{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:var(--faint);color:var(--ticket)}
.mute svg{width:20px;height:20px}
.mute .x{display:none}
.mute[aria-pressed=true]{background:var(--red)}
.mute[aria-pressed=true] .x{display:inline}
.mute[aria-pressed=true] .wave{display:none}
.person input[type=range]{grid-column:1/-1;width:100%;height:28px;margin:0;accent-color:var(--lamp)}
.person.self{grid-template-columns:1fr}
.person.self .name{color:var(--muted);font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ticket);color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:500;
  box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:10}

/* ---------- Celular ---------- */
@media (max-width:899px){
  #room{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr;
    grid-template-areas:"top" "screen" "controls" "panel"}
  .screen{aspect-ratio:16/9;max-height:45dvh;width:100%}
  .panel{border-left:0}
  .controls{padding:8px}
  .ctl{min-width:64px}
}
@media (max-width:380px){
  .chip small{display:none}
  .ctl{min-width:56px}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<!-- ENTRADA -->
<main id="home">
  <div class="home-card">
    <header class="brand">
      <h1>Cine Jusce</h1>
      <p>Filmes estranhos de produtoras duvidosas</p>
    </header>
    <div class="ticket" id="homeTicket">
      <label class="field"><span>Seu nome</span>
        <input id="nameIn" maxlength="24" placeholder="Como os outros vão te ver" autocomplete="nickname" enterkeyhint="next">
      </label>
      <div id="createBlock"><button class="btn lamp" id="btnHost">Criar sala</button></div>
      <div class="divider" id="divider">ou entre com um código</div>
      <div class="row" id="joinBlock">
        <input class="code" id="codeIn" maxlength="6" placeholder="ABC123" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" aria-label="Código da sala">
        <button class="btn" id="btnJoin">Entrar</button>
      </div>
    </div>
    <p class="hint">Sem cadastro. Com fones, a voz fica mais limpa.</p>
  </div>
</main>

<!-- SALA -->
<div id="room" class="hidden">
  <header class="top">
    <button class="chip" id="btnCopy" aria-label="Compartilhar link da sala">
      <small>Sala</small><b id="roomCode">------</b>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
    </button>
    <div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Conectando…</span></div>
  </header>

  <section class="screen" id="screen">
    <video id="video" autoplay playsinline></video>
    <div class="empty" id="empty">
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
      <div><button class="btn lamp hidden" id="btnRetry">Tentar de novo</button></div>
    </div>
    <button class="btn lamp unmute hidden" id="btnUnmute">Ativar som</button>
  </section>

  <nav class="controls" aria-label="Controles">
    <button class="ctl" id="btnMic" aria-pressed="true" aria-label="Desligar microfone">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/></svg></i>
      <span id="micLabel">Microfone</span>
    </button>
    <button class="ctl primary hidden" id="btnShare" aria-label="Compartilhar tela">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></i>
      <span>Compartilhar</span>
    </button>
    <button class="ctl hidden" id="btnStop" aria-label="Parar de compartilhar">
      <i><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></i>
      <span>Parar</span>
    </button>
    <button class="ctl" id="btnFull" aria-label="Tela cheia">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></i>
      <span>Tela cheia</span>
    </button>
    <button class="ctl danger" id="btnLeave" aria-label="Sair da sala">
      <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M14 17l5-5-5-5M19 12H9"/></svg></i>
      <span>Sair</span>
    </button>
  </nav>

  <aside class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabChat" aria-selected="true" aria-controls="paneChat">Chat <span class="badge hidden" id="unread"></span></button>
      <button class="tab" role="tab" id="tabPeople" aria-selected="false" aria-controls="panePeople">Pessoas <span class="count" id="peopleCount">1</span></button>
    </div>

    <div class="pane" id="paneChat" role="tabpanel" aria-labelledby="tabChat">
      <div id="log" aria-live="polite"></div>
      <form class="send" id="chatForm">
        <input id="chatIn" placeholder="Mensagem" autocomplete="off" enterkeyhint="send" aria-label="Mensagem">
        <button class="icon-btn" type="submit" aria-label="Enviar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </div>

    <div class="pane hidden" id="panePeople" role="tabpanel" aria-labelledby="tabPeople">
      <div class="people">
        <div class="person film hidden" id="filmRow">
          <div class="who"><span class="avatar"></span><span class="name">Filme</span></div>
          <span class="pct" id="filmPct">100%</span>
          <button class="mute" id="filmMute" aria-pressed="false" aria-label="Silenciar filme"></button>
          <input type="range" id="filmVol" min="0" max="100" value="100" aria-label="Volume do filme">
        </div>
        <div class="person self" id="selfRow">
          <div class="who"><span class="avatar"></span><span class="name" id="selfName">Você</span></div>
        </div>
        <div id="people"></div>
      </div>
    </div>
  </aside>
</div>

<div class="toast hidden" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const PREFIX = 'sessao-a-dois-';
let peer, role, stream = null, conns = [], myConn = null, myName = '';
let screenCalls = [];
const canShareScreen = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
const SPEAKER_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path class="x" d="M16 9l5 6M21 9l-5 6"/></svg>';

/* ---------------- Qualidade ----------------
   Opus é configurado via SDP: os parâmetros de fmtp dizem ao outro lado
   como ele deve ENVIAR para nós, então os dois lados ajustam a sua SDP. */
const VOICE_OPUS  = { minptime:10, useinbandfec:1, usedtx:0, stereo:0, maxaveragebitrate:128000 };
const SCREEN_OPUS = { minptime:10, useinbandfec:1, usedtx:0, stereo:1, 'sprop-stereo':1, maxaveragebitrate:510000, maxplaybackrate:48000 };
const VIDEO_MAX_BITRATE = 8_000_000; // 8 Mbps por espectador, 1080p

/* Servidores para atravessar roteadores/NAT.
   STUN: ajudam a conexão direta (melhor qualidade).
   TURN: retransmitem o vídeo quando a conexão direta é impossível.
   O TURN gratuito da PeerJS não existe mais. Usamos o TURN da Cloudflare:
   o worker.js (no Cloudflare Workers) gera credenciais temporárias em
   /turn-credentials, sem expor as chaves aqui.
   - TURN_CREDENTIALS_URL: endereço que devolve a lista de iceServers em JSON
   - EXTRA_TURN: credenciais fixas, ex.: { urls: 'turn:servidor:3478', username: '...', credential: '...' } */
const TURN_CREDENTIALS_URL = 'https://cine-jusce.funcookiestudio.workers.dev/turn-credentials';
const EXTRA_TURN = [];
const ICE_CONFIG = { iceServers: [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun2.l.google.com:19302'] },
  { urls: 'stun:stun.cloudflare.com:3478' },
  ...EXTRA_TURN
]};
let icePromise = null;
function getIceConfig(){
  if (!icePromise) icePromise = (async () => {
    if (!TURN_CREDENTIALS_URL) return ICE_CONFIG;
    try{
      const ctrl = new AbortController(); setTimeout(() => ctrl.abort(), 4000);
      const r = await fetch(TURN_CREDENTIALS_URL, { signal: ctrl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('TURN ' + r.status);
      const servers = await r.json();
      if (Array.isArray(servers) && servers.length) return { iceServers: [...ICE_CONFIG.iceServers, ...servers] };
    }catch(_){}
    return ICE_CONFIG;
  })();
  return icePromise;
}

function tuneOpus(sdp, params){
  const m = sdp.match(/a=rtpmap:(\d+) opus\/48000\/2/i);
  if (!m) return sdp;
  const pt = m[1];
  const re = new RegExp('a=fmtp:' + pt + ' ([^\\r\\n]*)');
  const fm = sdp.match(re);
  const cur = {};
  if (fm) fm[1].split(';').forEach(kv => { const [k, v] = kv.trim().split('='); if (k) cur[k] = v; });
  Object.assign(cur, params);
  const line = 'a=fmtp:' + pt + ' ' + Object.entries(cur).map(([k, v]) => k + '=' + v).join(';');
  return fm ? sdp.replace(re, line) : sdp.replace(m[0], m[0] + '\r\n' + line);
}
const voiceSdp  = sdp => tuneOpus(sdp, VOICE_OPUS);
const screenSdp = sdp => tuneOpus(sdp, SCREEN_OPUS);

// Ajusta bitrate/prioridade dos senders assim que a conexão sobe.
function tuneSenders(call, kind){
  const pc = call.peerConnection;
  if (!pc) return;
  const apply = async () => {
    for (const s of pc.getSenders()){
      if (!s.track) continue;
      const p = s.getParameters();
      if (!p.encodings || !p.encodings.length) continue;
      const e = p.encodings[0];
      e.priority = 'high'; e.networkPriority = 'high';
      if (s.track.kind === 'video'){
        e.maxBitrate = VIDEO_MAX_BITRATE; e.maxFramerate = 30;
        p.degradationPreference = 'maintain-framerate';
      } else {
        e.maxBitrate = kind === 'screen' ? 510000 : 128000;
      }
      try { await s.setParameters(p); } catch(_){}
    }
  };
  const check = () => pc.connectionState === 'connected' && apply();
  pc.addEventListener('connectionstatechange', check);
  check();
}

/* ---------------- Áudio local (microfone) ---------------- */
let actx = null, micReady = null, micTrack = null, selfAnalyser = null;

function ensureAudioCtx(){
  if (!actx){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(_){} }
  if (actx && actx.state === 'suspended') actx.resume();
}
async function getMic(){
  try{
    const s = await navigator.mediaDevices.getUserMedia({ audio: {
      echoCancellation:true, noiseSuppression:true, autoGainControl:true,
      channelCount:1, sampleRate:48000, sampleSize:16
    }});
    micTrack = s.getAudioTracks()[0];
    micTrack.contentHint = 'speech';
    selfAnalyser = makeAnalyser(s);
    return s;
  }catch(e){
    log('Microfone indisponível: você ouve os outros, mas eles não te ouvem.', 'sys');
    const b = $('btnMic'); b.disabled = true; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Microfone indisponível'); $('micLabel').textContent = 'Sem mic';
    // Stream silencioso para conseguir participar das chamadas
    if (actx) return actx.createMediaStreamDestination().stream;
    return new MediaStream();
  }
}
function makeAnalyser(s){
  if (!actx) return null;
  try{
    const an = actx.createAnalyser(); an.fftSize = 512;
    actx.createMediaStreamSource(s).connect(an);
    return an;
  }catch(_){ return null; }
}
const buf = new Float32Array(512);
function level(an){
  if (!an) return 0;
  an.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return Math.sqrt(sum / buf.length);
}
setInterval(() => {
  if (micTrack) $('selfRow').classList.toggle('talking', micTrack.enabled && level(selfAnalyser) > 0.02);
  people.forEach(p => p.row.classList.toggle('talking', !p.audio.muted && level(p.analyser) > 0.015));
}, 120);

/* ---------------- Pessoas (voz) ---------------- */
const people = new Map(); // peerId -> {name,row,audio,call,analyser}

function updateCount(){ $('peopleCount').textContent = people.size + 1; }

function setupMuteBtn(btn, label, onToggle){
  btn.innerHTML = SPEAKER_SVG;
  btn.setAttribute('aria-label', 'Silenciar ' + label);
  btn.onclick = () => {
    const muted = btn.getAttribute('aria-pressed') !== 'true';
    btn.setAttribute('aria-pressed', muted);
    btn.setAttribute('aria-label', (muted ? 'Reativar ' : 'Silenciar ') + label);
    onToggle(muted);
  };
}

function person(id, name){
  let p = people.get(id);
  if (p){ if (name && name !== p.name){ p.name = name; p.nameEl.textContent = name; p.slider.setAttribute('aria-label', 'Volume de ' + name); } return p; }
  name = name || 'Alguém';
  const row = document.createElement('div'); row.className = 'person';
  const who = document.createElement('div'); who.className = 'who';
  const av = document.createElement('span'); av.className = 'avatar';
  const nm = document.createElement('span'); nm.className = 'name'; nm.textContent = name;
  who.append(av, nm);
  const pct = document.createElement('span'); pct.className = 'pct'; pct.textContent = '100%';
  const mute = document.createElement('button'); mute.className = 'mute'; mute.type = 'button'; mute.setAttribute('aria-pressed', 'false');
  const slider = document.createElement('input');
  slider.type = 'range'; slider.min = 0; slider.max = 100; slider.value = 100;
  slider.setAttribute('aria-label', 'Volume de ' + name);
  row.append(who, pct, mute, slider);
  $('people').appendChild(row);

  const audio = new Audio(); audio.autoplay = true;
  p = { id, name, row, nameEl: nm, slider, audio, call: null, analyser: null };
  slider.oninput = () => { audio.volume = slider.value / 100; pct.textContent = slider.value + '%'; };
  setupMuteBtn(mute, name, muted => { audio.muted = muted; });
  people.set(id, p);
  updateCount();
  return p;
}
function removePerson(id){
  const p = people.get(id); if (!p) return;
  try { p.call && p.call.close(); } catch(_){}
  p.audio.srcObject = null; p.row.remove();
  people.delete(id);
  updateCount();
}

function setupVoice(call, name){
  const p = person(call.peer, name);
  if (p.call && p.call !== call) try { p.call.close(); } catch(_){}
  p.call = call;
  tuneSenders(call, 'voice');
  call.on('stream', s => {
    if (p.audio.srcObject === s) return; // PeerJS às vezes emite duas vezes
    p.audio.srcObject = s;
    p.audio.play().catch(() => $('btnUnmute').classList.remove('hidden'));
    p.analyser = makeAnalyser(s);
  });
  call.on('close', () => { if (p.call === call) removePerson(call.peer); });
  watchDrop(call.peerConnection, () => { if (p.call === call) removePerson(call.peer); });
}
// Detecta quem caiu sem avisar (aba fechada, rede perdida).
function watchDrop(pc, onDrop){
  if (!pc) return;
  let timer = null;
  pc.addEventListener('connectionstatechange', () => {
    const st = pc.connectionState;
    clearTimeout(timer);
    if (st === 'failed' || st === 'closed') onDrop();
    else if (st === 'disconnected') timer = setTimeout(onDrop, 6000);
  });
}
async function callVoice(id, name){
  if (id === peer.id || (people.get(id) && people.get(id).call)) return;
  const s = await micReady;
  const call = peer.call(id, s, { metadata: { kind: 'voice', name: myName }, sdpTransform: voiceSdp });
  if (call) setupVoice(call, name);
}

function onCall(call){
  const meta = call.metadata || {};
  if (meta.kind === 'voice'){
    micReady.then(s => { call.answer(s, { sdpTransform: voiceSdp }); setupVoice(call, meta.name); });
    return;
  }
  if (role !== 'guest') return;
  // Tela do anfitrião
  if (screenCall && screenCall !== call) try { screenCall.close(); } catch(_){}
  screenCall = call;
  call.answer(undefined, { sdpTransform: screenSdp });
  showEmpty('Carregando o filme…');
  clearTimeout(videoWatchdog);
  videoWatchdog = setTimeout(() => checkVideo(call), 12000);
  call.on('stream', s => {
    const v = $('video'); if (v.srcObject === s) return;
    v.srcObject = s; v.muted = $('filmMute').getAttribute('aria-pressed') === 'true';
    v.volume = $('filmVol').value / 100;
    $('filmRow').classList.remove('hidden');
    v.play().catch(() => { v.muted = true; v.play(); $('btnUnmute').classList.remove('hidden'); });
  });
  call.on('close', () => {
    if (screenCall !== call) return;
    screenCall = null; clearTimeout(videoWatchdog);
    $('video').srcObject = null;
    showEmpty('Transmissão pausada', 'Aguardando o anfitrião compartilhar de novo.');
  });
}

/* O vídeo só aparece quando o primeiro quadro chega de verdade. */
let screenCall = null, videoWatchdog = null;
function videoArrived(){
  const v = $('video');
  if (v.srcObject && v.videoWidth > 0){ $('empty').classList.add('hidden'); clearTimeout(videoWatchdog); }
}
['loadeddata', 'resize', 'playing'].forEach(ev => $('video').addEventListener(ev, videoArrived));

// Diagnóstico: tipo de conexão e quanto vídeo chegou
async function netInfo(pc){
  const info = { state: pc ? pc.connectionState : 'sem conexão', relay: false, kb: 0 };
  if (!pc) return info;
  try{
    const st = await pc.getStats(); let pair = null;
    st.forEach(r => {
      if (r.type === 'transport' && r.selectedCandidatePairId) pair = st.get(r.selectedCandidatePairId);
      if (r.type === 'inbound-rtp' && r.kind === 'video') info.kb = Math.round(r.bytesReceived / 1024);
    });
    if (!pair) st.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') pair = r; });
    if (pair){
      const l = st.get(pair.localCandidateId), rm = st.get(pair.remoteCandidateId);
      info.relay = (l && l.candidateType === 'relay') || (rm && rm.candidateType === 'relay');
    }
  }catch(_){}
  return info;
}
async function checkVideo(call){
  if (!call){ showEmpty('Transmissão pausada', 'O anfitrião não está compartilhando a tela agora.'); return; }
  if (call !== screenCall || $('video').videoWidth > 0) return;
  const n = await netInfo(call.peerConnection);
  if (call !== screenCall || $('video').videoWidth > 0) return;
  const how = n.state === 'connected'
    ? (n.relay ? 'conectado por servidor intermediário (mais lento)' : 'conexão direta')
    : 'a conexão de vídeo não abriu (' + n.state + ')';
  showEmpty('O filme não está chegando',
    'Diagnóstico: ' + how + ' · ' + n.kb + ' kB de vídeo recebidos. Toque em “Tentar de novo”. Se continuar, a rede de vocês provavelmente bloqueia conexão direta.');
  $('btnRetry').classList.remove('hidden');
}

/* ---------------- Utilidades ---------------- */
const genCode = () => {
  const c = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({length:6}, () => c[Math.floor(Math.random()*c.length)]).join('');
};
function readName(fallback){
  const n = $('nameIn').value.trim().slice(0, 24) || fallback;
  try { localStorage.setItem('sessao-nome', n); } catch(_){}
  return n;
}
function showRoom(code){
  $('home').classList.add('hidden');
  $('room').classList.remove('hidden');
  $('roomCode').textContent = code;
  $('selfName').textContent = myName + ' (você)';
  history.replaceState(null, '', '#' + code);
}
function showEmpty(title, text){
  $('empty').classList.remove('hidden');
  $('emptyTitle').textContent = title; $('emptyText').textContent = text || '';
  $('btnRetry').classList.add('hidden');
}
function setStatus(txt, on){ $('statusTxt').textContent = txt; $('dot').classList.toggle('on', !!on); }

let toastTimer;
function toast(txt){
  const t = $('toast'); t.textContent = txt; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add('hidden'), 1800);
}

let tab = 'chat', unread = 0;
function showTab(name){
  tab = name;
  $('tabChat').setAttribute('aria-selected', name === 'chat');
  $('tabPeople').setAttribute('aria-selected', name === 'people');
  $('paneChat').classList.toggle('hidden', name !== 'chat');
  $('panePeople').classList.toggle('hidden', name !== 'people');
  if (name === 'chat'){ unread = 0; $('unread').classList.add('hidden'); $('log').scrollTop = 1e9; }
}
function log(txt, cls='', from=''){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  if (from){ const b = document.createElement('b'); b.textContent = from; d.appendChild(b); }
  d.appendChild(document.createTextNode(txt));
  $('log').appendChild(d); $('log').scrollTop = 1e9;
  if (!cls && tab !== 'chat'){ unread++; $('unread').textContent = unread; $('unread').classList.remove('hidden'); }
}
const countTxt = () => conns.length ? (conns.length + 1) + ' na sala' : 'Aguardando amigos';

/* ---------------- ANFITRIÃO ---------------- */
async function startHost(){
  role = 'host';
  const code = genCode();
  peer = new Peer(PREFIX + code, { config: await getIceConfig() });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') return startHost();
    if (e.type === 'peer-unavailable') return;
    setStatus('Erro: ' + e.type);
  });
  peer.on('call', onCall);
  peer.on('open', () => {
    showRoom(code);
    if (canShareScreen){
      $('btnShare').classList.remove('hidden');
      showEmpty('Sala pronta', 'Envie o link da sala e toque em “Compartilhar”. Escolha a aba do filme e marque “Compartilhar áudio da guia”.');
    } else {
      showEmpty('Sala pronta', 'Este aparelho não consegue compartilhar a tela. Para passar o filme, abra a sala no computador. Aqui dá para conversar por voz.');
    }
    setStatus(countTxt(), false);
  });
  peer.on('connection', conn => {
    conns.push(conn);
    const name = (conn.metadata && conn.metadata.name) || 'Alguém';
    conn.on('open', () => {
      // Lista de quem já está na sala: o novato liga para todos (voz em malha)
      const roster = [{ id: peer.id, name: myName }].concat(
        conns.filter(c => c !== conn && c.open).map(c => ({ id: c.peer, name: (c.metadata && c.metadata.name) || 'Alguém' }))
      );
      conn.send({ t: 'roster', peers: roster });
      relay({ t: 'join', id: conn.peer, name }, conn);
      person(conn.peer, name);
      setStatus(countTxt(), true);
      log(name + ' entrou', 'sys');
      if (stream) callScreen(conn.peer);
      watchDrop(conn.peerConnection, () => conn.close());
    });
    conn.on('data', d => {
      if (d.t === 'chat') { log(d.msg, '', d.name); relay(d, conn); }
      else if (d.t === 'resend' && stream) callScreen(conn.peer); // convidado pediu o vídeo de novo
    });
    conn.on('close', () => {
      conns = conns.filter(c => c !== conn);
      removePerson(conn.peer);
      relay({ t: 'leave', id: conn.peer });
      setStatus(countTxt(), conns.length > 0);
      log(name + ' saiu', 'sys');
    });
  });
}
function relay(d, from){ conns.forEach(c => c !== from && c.open && c.send(d)); }

function callScreen(id){
  // Uma transmissão por pessoa: fecha a anterior antes de mandar de novo
  screenCalls = screenCalls.filter(c => { if (c.peer !== id) return true; try { c.close(); } catch(_){} return false; });
  const call = peer.call(id, stream, { metadata: { kind: 'screen' }, sdpTransform: screenSdp });
  if (!call) return;
  screenCalls.push(call);
  tuneSenders(call, 'screen');
}

async function shareScreen(){
  try{
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30, max: 60 } },
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:2, sampleRate:48000 },
      systemAudio: 'include'
    });
  }catch(e){ return; }
  const vt = stream.getVideoTracks()[0];
  if ('contentHint' in vt) vt.contentHint = 'motion';
  stream.getAudioTracks().forEach(t => { if ('contentHint' in t) t.contentHint = 'music'; });
  const v = $('video'); v.srcObject = stream; v.muted = true; v.play();
  $('empty').classList.add('hidden');
  $('btnShare').classList.add('hidden'); $('btnStop').classList.remove('hidden');
  conns.forEach(c => c.open && callScreen(c.peer));
  if (!stream.getAudioTracks().length) log('Sem som do filme: ao compartilhar, marque “Compartilhar áudio da guia”.', 'sys');
  vt.addEventListener('ended', stopShare);
}
function stopShare(){
  if (!stream) return;
  stream.getTracks().forEach(t => t.stop()); stream = null;
  screenCalls.forEach(c => { try { c.close(); } catch(_){} }); screenCalls = [];
  $('video').srcObject = null;
  showEmpty('Compartilhamento parado', 'Toque em “Compartilhar” para voltar a passar o filme.');
  $('btnShare').classList.remove('hidden'); $('btnStop').classList.add('hidden');
}

/* ---------------- CONVIDADO ---------------- */
async function startGuest(code){
  role = 'guest';
  code = code.trim().toUpperCase();
  if (code.length < 6) return;
  peer = new Peer(undefined, { config: await getIceConfig() });
  peer.on('error', e => {
    if (e.type === 'peer-unavailable' && myConn && myConn.open) return; // outro convidado sumiu
    setStatus(e.type === 'peer-unavailable' ? 'Sala não encontrada' : 'Erro: ' + e.type);
    if (e.type === 'peer-unavailable') showEmpty('Sala não encontrada', 'Confira o código com quem te convidou.');
  });
  peer.on('call', onCall);
  peer.on('open', () => {
    showRoom(code);
    showEmpty('Entrando na sala…');
    myConn = peer.connect(PREFIX + code, { reliable: true, metadata: { name: myName } });
    myConn.on('open', () => {
      setStatus('Na sala', true);
      showEmpty('Você está na sala', 'O filme aparece aqui assim que o anfitrião compartilhar.');
    });
    myConn.on('data', d => {
      if (d.t === 'chat') log(d.msg, '', d.name);
      else if (d.t === 'roster') d.peers.forEach(p => callVoice(p.id, p.name));
      else if (d.t === 'join') { person(d.id, d.name); log(d.name + ' entrou', 'sys'); }
      else if (d.t === 'leave') {
        const p = people.get(d.id); if (p) log(p.name + ' saiu', 'sys');
        removePerson(d.id);
      }
    });
    myConn.on('close', () => {
      setStatus('Sala encerrada', false);
      [...people.keys()].forEach(removePerson);
      showEmpty('A sala foi encerrada', 'O anfitrião saiu.');
    });
  });
}

/* ---------------- UI ---------------- */
function enter(kind){
  ensureAudioCtx(); // dentro do toque, para o navegador liberar o áudio
  if (kind === 'host'){ myName = readName('Anfitrião'); micReady = getMic(); startHost(); }
  else {
    if ($('codeIn').value.trim().length < 6) return $('codeIn').focus();
    myName = readName('Convidado ' + Math.floor(10 + Math.random()*90));
    micReady = getMic(); startGuest($('codeIn').value);
  }
}
$('btnHost').onclick = () => enter('host');
$('btnJoin').onclick = () => enter('guest');
$('codeIn').addEventListener('keydown', e => e.key === 'Enter' && enter('guest'));
$('nameIn').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if ($('homeTicket').classList.contains('invited')) enter('guest'); else $('codeIn').focus();
});
$('btnRetry').onclick = () => {
  if (!myConn || !myConn.open) return;
  myConn.send({ t: 'resend' });
  showEmpty('Carregando o filme…', 'Pedindo o vídeo de novo ao anfitrião.');
  clearTimeout(videoWatchdog);
  videoWatchdog = setTimeout(() => checkVideo(screenCall), 12000); // se nenhuma nova transmissão chegar
};
$('btnShare').onclick = shareScreen;
$('btnStop').onclick = stopShare;
$('btnLeave').onclick = () => { history.replaceState(null,'',location.pathname); location.reload(); };
$('btnFull').onclick = () => {
  const s = $('screen'), v = $('video');
  if (document.fullscreenElement || document.webkitFullscreenElement) return (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  if (s.requestFullscreen) s.requestFullscreen();
  else if (s.webkitRequestFullscreen) s.webkitRequestFullscreen();
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen(); // iPhone
};
$('btnUnmute').onclick = () => {
  ensureAudioCtx();
  if ($('filmMute').getAttribute('aria-pressed') !== 'true') $('video').muted = false;
  people.forEach(p => p.audio.play().catch(() => {}));
  $('btnUnmute').classList.add('hidden');
};
$('btnMic').onclick = () => {
  if (!micTrack) return;
  micTrack.enabled = !micTrack.enabled;
  const b = $('btnMic');
  b.setAttribute('aria-pressed', micTrack.enabled);
  b.setAttribute('aria-label', micTrack.enabled ? 'Desligar microfone' : 'Ligar microfone');
  $('micLabel').textContent = micTrack.enabled ? 'Microfone' : 'Mudo';
};
$('filmVol').oninput = () => { $('video').volume = $('filmVol').value / 100; $('filmPct').textContent = $('filmVol').value + '%'; };
setupMuteBtn($('filmMute'), 'filme', muted => { $('video').muted = muted; });
$('tabChat').onclick = () => showTab('chat');
$('tabPeople').onclick = () => showTab('people');
$('btnCopy').onclick = async () => {
  const link = location.origin + location.pathname + '#' + $('roomCode').textContent;
  if (navigator.share && matchMedia('(pointer:coarse)').matches){
    try { await navigator.share({ title: 'Cine Jusce', text: 'Vem assistir comigo no Cine Jusce:', url: link }); } catch(_){}
    return;
  }
  try { await navigator.clipboard.writeText(link); toast('Link copiado'); }
  catch { prompt('Copie o link:', link); }
};
$('chatForm').onsubmit = e => {
  e.preventDefault();
  const msg = $('chatIn').value.trim(); if (!msg) return;
  const d = { t:'chat', msg, name: myName };
  if (role === 'host') conns.forEach(c => c.open && c.send(d));
  else if (myConn && myConn.open) myConn.send(d);
  else return;
  log(msg, 'me'); $('chatIn').value = '';
};

// Fecha as conexões ao sair/fechar a aba, para os outros saberem na hora
window.addEventListener('pagehide', () => { try { peer && peer.destroy(); } catch(_){} });

// Nome salvo e link com #CODIGO (convite: “Entrar” vira a ação principal)
try { $('nameIn').value = localStorage.getItem('sessao-nome') || ''; } catch(_){}
if (location.hash.length > 1){
  $('codeIn').value = location.hash.slice(1, 7).toUpperCase();
  $('homeTicket').classList.add('invited');
  $('btnJoin').classList.add('lamp');
  $('btnHost').textContent = 'Criar outra sala';
  $('divider').textContent = 'ou';
}
</script>
